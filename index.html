<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<meta name="description" content="APPCHAT — Discutez et restez connectés.">
<title>APPCHAT</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b141a;
  --panel: #111b21;
  --bar: #202c33;
  --blue: #2589ff;
  --green: #25d366;
  --text: #ffffff;
  --muted: #a0adb5;
  --border: #2a3942;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
header {
  padding: 22px 18px;
  background: var(--bar);
  border-bottom: 1px solid var(--border);
}
.brand {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 2px;
  color: white;
}
.brand span { color: var(--blue); }
main {
  width: 100%;
  max-width: 460px;
  margin: 35px auto;
  padding: 18px;
}
.card {
  padding: 24px 20px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
}
h1 { font-size: 25px; margin: 0 0 8px; }
.subtitle {
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 24px;
}
label {
  display: block;
  font-size: 14px;
  margin: 17px 0 8px;
}
input, textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: white;
  outline: none;
}
input:focus, textarea:focus {
  border-color: var(--blue);
}
textarea { resize: vertical; min-height: 75px; }
.primary, .secondary {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 14px;
  margin-top: 16px;
  font-weight: bold;
}
.primary { background: var(--blue); color: white; }
.secondary { background: var(--bar); color: white; }
.primary:disabled { opacity: .6; cursor: wait; }
.hidden { display: none !important; }
.message {
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.error { color: #ff7777; }
.success { color: var(--green); }
.profile {
  text-align: center;
  padding: 20px 0;
}
.avatar {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  margin: 0 auto 15px;
  background: var(--bar);
  border: 2px solid var(--blue);
  display: grid;
  place-items: center;
  font-size: 30px;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: 12px;
}
</style>
</head>

<body>
<header>
  <div class="brand">APP<span>CHAT</span></div>
</header>

<main>
  <section class="card" id="authCard">
    <h1 id="formTitle">Bienvenue sur APPCHAT</h1>
    <p class="subtitle" id="formSubtitle">
      Connecte-toi ou crée ton compte pour commencer.
    </p>

    <form id="authForm">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="30"
        autocomplete="username"
        placeholder="Ton nom d'utilisateur"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Ton mot de passe"
        required
      >

      <div id="registerFields" class="hidden">
        <label for="bio">Bio (facultative)</label>
        <textarea
          id="bio"
          maxlength="300"
          placeholder="Parle un peu de toi..."
        ></textarea>
      </div>

      <button class="primary" id="submitButton" type="submit">
        Se connecter
      </button>
    </form>

    <button class="secondary" id="switchButton" type="button">
      Créer un compte
    </button>

    <div id="authMessage" class="message" role="status" aria-live="polite"></div>
  </section>

  <section class="card hidden" id="homeCard">
    <div class="profile">
      <div class="avatar" id="avatar">A</div>
      <h1 id="welcomeTitle">Bienvenue</h1>
      <p class="subtitle" id="profileBio"></p>
      <p class="success">Connecté à APPCHAT</p>
    </div>

    <button class="primary" id="continueButton" type="button">
      Accueil
    </button>

    <button class="secondary" id="logoutButton" type="button">
      Se déconnecter
    </button>

    <div id="homeMessage" class="message"></div>
  </section>
</main>

<footer>APPCHAT · Messagerie</footer>

<script>
"use strict";

/* Configuration Supabase */
const SUPABASE_FUNCTION_URL =
  "https://jebypdzahbhwjnyyepyc.supabase.co/functions/v1/blockchat-auth-";

const SUPABASE_PUBLIC_KEY =
  ''sb_publishable_zopRaeiintTmlazVVp3Aow_0m7bC2Wk''

/* Éléments de l'interface */
const authCard = document.getElementById("authCard");
const homeCard = document.getElementById("homeCard");
const authForm = document.getElementById("authForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const bioInput = document.getElementById("bio");
const registerFields = document.getElementById("registerFields");
const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const submitButton = document.getElementById("submitButton");
const switchButton = document.getElementById("switchButton");
const authMessage = document.getElementById("authMessage");

let registerMode = false;
let currentUser = null;
let currentSession = null;

function showMessage(element, message, type = "") {
  element.textContent = message;
  element.className = "message " + type;
}

function switchMode() {
  registerMode = !registerMode;

  registerFields.classList.toggle("hidden", !registerMode);

  formTitle.textContent = registerMode
    ? "Créer un compte"
    : "Bienvenue sur APPCHAT";

  formSubtitle.textContent = registerMode
    ? "Rejoins APPCHAT avec ton nom d'utilisateur."
    : "Connecte-toi pour continuer.";

  submitButton.textContent = registerMode
    ? "Créer mon compte"
    : "Se connecter";

  switchButton.textContent = registerMode
    ? "J'ai déjà un compte"
    : "Créer un compte";

  passwordInput.autocomplete = registerMode
    ? "new-password"
    : "current-password";

  showMessage(authMessage, "");
}

switchButton.addEventListener("click", function () {
  registerMode = !registerMode;

  registerFields.classList.toggle("hidden", !registerMode);

  formTitle.textContent = registerMode
    ? "Créer un compte"
    : "Bienvenue sur APPCHAT";

  formSubtitle.textContent = registerMode
    ? "Rejoins APPCHAT avec ton nom d'utilisateur."
    : "Connecte-toi ou crée ton compte pour commencer.";

  submitButton.textContent = registerMode
    ? "Créer mon compte"
    : "Se connecter";

  switchButton.textContent = registerMode
    ? "J'ai déjà un compte"
    : "Créer un compte";

  passwordInput.autocomplete = registerMode
    ? "new-password"
    : "current-password";

  showMessage(authMessage, "");
});

/* Appel de la Edge Function */
async function callAuthFunction(payload) {
  if (
    !SUPABASE_PUBLIC_KEY ||
    SUPABASE_PUBLIC_KEY === "COLLE_TA_CLE_PUBLIQUE_ICI"
  ) {
    throw new Error("Ajoute la clé publique Supabase dans index.html.");
  }

  const response = await fetch(SUPABASE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_PUBLIC_KEY
    },
    body: JSON.stringify(payload)
  });

  const raw = await response.text();

  let result;
  try {
    result = JSON.parse(raw);
  } catch {
    throw new Error(
      "Le serveur a renvoyé une réponse illisible. Vérifie les journaux de la fonction."
    );
  }

  if (!response.ok) {
    throw new Error(
      result.error || result.message || "Erreur serveur : " + response.status
    );
  }

  if (result.error) {
    throw new Error(result.error);
  }

  return result;
}

/* Récupération de l'utilisateur renvoyé par le serveur */
function extractUser(result) {
  return result.user ||
         result.profile ||
         result.account ||
         null;
}

function extractSession(result) {
  return result.session ||
         result.data?.session ||
         null;
}

/* Afficher l'espace utilisateur */
function showHome(user, session) {
  currentUser = user;
  currentSession = session;

  const username =
    user?.username ||
    user?.display_name ||
    usernameInput.value.trim();

  document.getElementById("welcomeTitle").textContent =
    "Bienvenue, " + username;

  document.getElementById("profileBio").textContent =
    user?.bio || "Bienvenue dans ton espace APPCHAT.";

  const avatar = document.getElementById("avatar");
  avatar.replaceChildren();

  if (user?.photo_url || user?.avatar_url) {
    const img = document.createElement("img");
    img.src = user.photo_url || user.avatar_url;
    img.alt = "Photo de profil";
    avatar.appendChild(img);
  } else {
    avatar.textContent = username.charAt(0).toUpperCase() || "A";
  }

  authCard.classList.add("hidden");
  homeCard.classList.remove("hidden");
}

/* Inscription et connexion */
authForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  if (username.length < 3) {
    showMessage(
      authMessage,
      "Le nom d'utilisateur doit contenir au moins 3 caractères.",
      "error"
    );
    return;
  }

  if (!password) {
    showMessage(authMessage, "Saisis ton mot de passe.", "error");
    return;
  }

  const originalText = submitButton.textContent;
  submitButton.disabled = true;
  submitButton.textContent = "Connexion en cours...";
  showMessage(authMessage, "");

  try {
    const payload = registerMode
      ? {
          action: "register",
          username,
          password,
          bio: bioInput.value.trim()
        }
      : {
          action: "login",
          username,
          password
        };

    const result = await callAuthFunction(payload);

    /*
      Certaines fonctions renvoient un compte créé sans session.
      Dans ce cas, on demande à l'utilisateur de se connecter.
    */
    const user = extractUser(result);
    const session = extractSession(result);

    if (registerMode && !session) {
      showMessage(
        authMessage,
        "Compte créé si confirmé par le serveur. Connecte-toi maintenant.",
        "success"
      );

      registerMode = true;
      switchMode();
      usernameInput.value = username;
      passwordInput.value = "";
      registerMode = false;
      switchMode();

      return;
    }

    if (!user && !session) {
      throw new Error(
        "Réponse reçue, mais aucune information de compte ou de session n'a été renvoyée."
      );
    }

    /*
      On conserve uniquement les informations non sensibles du profil.
      La session sera traitée séparément lorsque le format réel de
      la réponse du serveur aura été confirmé.
    */
    const profile = user || {
      username,
      bio: bioInput.value.trim()
    };

    try {
      localStorage.setItem(
        "appchat_profile",
        JSON.stringify({
          username: profile.username || username,
          bio: profile.bio || "",
          photo_url: profile.photo_url || null
        })
      );
    } catch {}

    showHome(profile, session);

  } catch (error) {
    showMessage(
      authMessage,
      error.message || "Impossible de contacter APPCHAT.",
      "error"
    );
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = originalText;
  }
});

/* Bouton d'accueil : la messagerie sera branchée ensuite */
document.getElementById("continueButton").addEventListener("click", () => {
  showMessage(
    document.getElementById("homeMessage"),
    "L'authentification est prête à être intégrée. La messagerie doit encore être connectée à ses tables Supabase.",
    ""
  );
});

/* Déconnexion de l'interface */
document.getElementById("logoutButton").addEventListener("click", () => {
  currentUser = null;
  currentSession = null;

  homeCard.classList.add("hidden");
  authCard.classList.remove("hidden");

  authForm.reset();
  showMessage(authMessage, "Tu es déconnecté.", "success");
});
</script>
</body>
  </html>
