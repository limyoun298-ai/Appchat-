<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1E">
<meta name="description" content="APPCHAT — Discutez, partagez vos actualités et restez connectés.">
<meta name="application-name" content="APPCHAT">
<link rel="manifest" href="./manifest.json">
<title>APPCHAT</title>

<style>
:root{--blue:#0A84FF;--gray:#1E293B;--black:#0A0F1E;--white:#FFF;--green:#00C950;--muted:#94A3B8;--border:#263449}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{min-height:100dvh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{color:white}
.hidden{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app,.page{min-height:100dvh}
.auth-wrap{display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:400px}
.brand,.top-brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand{font-size:25px}
.logo{width:44px;height:44px;background:var(--blue);border-radius:10px;display:grid;place-items:center;font-size:30px;font-weight:900}
.subtitle{color:var(--muted);line-height:1.5;font-size:14px;margin:16px 0 24px}
.field{display:block;width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--gray);margin:10px 0}
textarea.field{resize:vertical;min-height:90px}
.primary,.secondary,.danger{width:100%;border:0;border-radius:24px;min-height:48px;padding:12px 16px;font-weight:700}
.primary{background:var(--blue);color:white}
.secondary{background:var(--gray);color:white;border:1px solid var(--border)}
.danger{background:#401f2a;color:#fecaca}
.switch-line{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}
.text-button{border:0;background:none;color:var(--blue);font-weight:700;padding:8px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:12px 0}
.error{color:#fca5a5;font-size:13px;line-height:1.5;margin:10px 0}
.success{color:#86efac;font-size:13px;line-height:1.5;margin:10px 0}
#toast{position:fixed;z-index:100;bottom:88px;left:16px;right:16px;margin:auto;max-width:420px;background:#243247;padding:13px 16px;border-radius:14px;box-shadow:0 8px 28px #0007;font-size:14px}
.topbar{height:60px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--black);border-bottom:1px solid var(--border)}
.top-brand{font-size:20px}
.top-brand .logo{height:34px;width:34px;border-radius:7px;font-size:24px}
.icon-button{height:42px;min-width:42px;border:0;background:transparent;color:white;border-radius:50%;display:inline-grid;place-items:center}
.icon-button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header-actions{display:flex;gap:3px}
.content{max-width:700px;margin:auto;padding:14px 14px 100px}
.search-wrap{height:42px;border-radius:24px;background:var(--gray);display:flex;align-items:center;gap:10px;padding:0 14px;margin:8px 0 16px}
.search-wrap svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:2}
.search-wrap input{border:0;outline:0;background:transparent;width:100%;font-size:14px}
.section-title{font-size:15px;font-weight:700;margin:20px 0 12px}
.story-row{display:flex;gap:15px;overflow-x:auto;padding:4px 1px 12px}
.story-item{width:68px;flex:0 0 68px;text-align:center;border:0;background:transparent;color:white;padding:0}
.story-circle{width:62px;height:62px;margin:auto auto 6px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;overflow:hidden;background:var(--gray);font-size:23px}
.story-circle img,.story-circle video{width:100%;height:100%;object-fit:cover}
.story-circle.add{border-style:dashed;color:var(--blue);font-size:30px}
.story-name{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #1b2738;cursor:pointer}
.avatar{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:var(--gray);display:grid;place-items:center;overflow:hidden;font-size:22px;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.small{width:36px;height:36px;flex-basis:36px;font-size:15px}
.user-main{flex:1;min-width:0}
.user-name{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:700;min-width:0}
.user-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last-message{font-size:14px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:10px;color:var(--muted);white-space:nowrap}
.verified{width:15px;height:15px;display:inline-grid;place-items:center;flex:0 0 15px;border-radius:50%;background:var(--green)}
.verified svg{width:9px;height:9px;stroke:white;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:15;min-height:70px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:var(--black);border-top:1px solid var(--border)}
.nav-button{border:0;background:transparent;color:var(--muted);min-width:65px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:7px;border-radius:20px}
.nav-button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-button.active{background:var(--gray);color:white}
.panel{background:#111a2a;border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0}
.panel h2{font-size:18px;margin:0 0 12px}
.panel p{font-size:14px;color:var(--muted);line-height:1.5}
.profile-head{display:flex;align-items:center;gap:14px;margin:10px 0 20px}
.profile-head .avatar{width:80px;height:80px;flex-basis:80px}
.item-button{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:transparent;color:white;border:0;border-bottom:1px solid var(--border);padding:16px 4px}
.item-button:last-child{border-bottom:0}
.chat-page{height:100dvh;display:flex;flex-direction:column}
.chat-header{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--border)}
.chat-header .user-name{font-size:16px}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
.message{max-width:85%;padding:11px 14px;border-radius:18px;overflow-wrap:anywhere;font-size:15px;line-height:1.4}
.message.sent{align-self:flex-end;background:var(--blue);border-bottom-right-radius:5px}
.message.received{align-self:flex-start;background:var(--gray);border-bottom-left-radius:5px}
.message-meta{font-size:10px;text-align:right;margin-top:5px;opacity:.8}
.message-media{display:block;max-width:100%;max-height:360px;border-radius:12px;margin-bottom:5px}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.composer input{flex:1;min-width:0;background:var(--gray);border:0;border-radius:24px;padding:13px 16px}
.send-button{height:44px;width:44px;flex:0 0 44px;border:0;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center}
.send-button svg{width:23px;height:23px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subpage-header{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.subpage-header h2{font-size:19px;margin:0}
.counter{text-align:right;color:var(--muted);font-size:10px}
.status-text{font-size:13px;line-height:1.5;margin:12px 0}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.story-viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.story-viewer img,.story-viewer video{width:100%;height:100%;object-fit:contain}
.story-viewer .story-close{position:absolute;top:12px;right:12px;z-index:2}
.official-card{display:flex;align-items:center;gap:12px;padding:13px;margin:10px 0 16px;background:#111a2a;border:1px solid #263449;border-radius:16px;cursor:pointer}
.official-avatar{height:54px;width:54px;flex:0 0 54px;border-radius:50%;background:#0A84FF;display:grid;place-items:center;font-weight:900;font-size:25px}
.official-card-main{flex:1;min-width:0}
.official-card-title{display:flex;align-items:center;gap:5px;font-weight:800}
.official-card p{font-size:12px;color:var(--muted);margin:5px 0 0}
.official-open{background:var(--blue);border:0;border-radius:20px;color:white;padding:8px 12px;font-size:12px;font-weight:700}
.official-cover{border-radius:18px;padding:24px 16px;text-align:center;background:linear-gradient(140deg,#0A84FF,#102b55 65%,#111a2a);margin-bottom:16px}
.official-cover .official-avatar{width:82px;height:82px;margin:0 auto 12px;border:3px solid white;font-size:38px}
.official-cover h2{margin:6px 0;font-size:24px}
.official-cover p{font-size:14px;color:#e2e8f0;line-height:1.5}
.subscribe-button{border:0;border-radius:24px;padding:12px 22px;background:white;color:#0A0F1E;font-weight:800}
.subscribe-button.subscribed{background:#1E293B;color:white;border:1px solid #526176}
.official-post{padding:16px;margin:12px 0;background:#111a2a;border:1px solid var(--border);border-radius:16px}
.official-post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.official-post h3{font-size:16px;margin:0}
.official-post p{font-size:14px;line-height:1.6;color:#d7e0eb;white-space:pre-wrap}
.post-date{font-size:11px;color:var(--muted);margin-top:5px}
@media(min-width:600px){.content{padding-top:20px}.auth-card{padding:28px;border:1px solid var(--border);border-radius:20px;background:#111a2a}}
</style>
</head>

<body>
<div id="app">
<section id="authPage" class="page auth-wrap">
<div class="auth-card">
<div class="brand"><div class="logo">A</div><span>APPCHAT</span></div>
<p class="subtitle">Discutez, partagez vos actualités et restez connectés.</p>
<form id="authForm">
<label for="username" class="note">Nom d’utilisateur</label>
<input class="field" id="username" name="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" placeholder="Ton nom d’utilisateur" required>
<label for="password" class="note">Mot de passe</label>
<input class="field" id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="8 caractères minimum" required>
<div id="registerFields" class="hidden">
<label for="bio" class="note">Bio (facultatif, 100 caractères maximum)</label>
<textarea class="field" id="bio" maxlength="100" placeholder="Présente-toi..."></textarea>
<div class="counter"><span id="bioCount">0</span>/100</div>
<label for="photoUrl" class="note">Lien de la photo (facultatif)</label>
<input class="field" id="photoUrl" type="url" placeholder="https://...">
</div>
<button class="primary" id="authSubmit" type="submit">Se connecter</button>
<div id="authMessage" aria-live="polite"></div>
</form>
<div class="switch-line"><span id="switchText">Tu n’as pas de compte ?</span>
<button class="text-button" id="switchButton" type="button">Créer un compte</button></div>
<p class="note">Aucun e-mail ni numéro de téléphone n’est demandé dans l’application.</p>
</div>
</section>

<section id="homePage" class="page hidden">
<header class="topbar">
<div class="top-brand"><div class="logo">A</div><span>APPCHAT</span></div>
<div class="header-actions">
<button class="icon-button" id="newChatButton" aria-label="Nouvelle discussion" title="Nouvelle discussion"><svg viewBox="0 0 24 24"><path d="M12 20H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="m16 19 5-5M17 14h4v4"/></svg></button>
<button class="icon-button" id="settingsButton" aria-label="Paramètres" title="Paramètres"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg></button>
</div></header>
<main class="content">
<div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="searchInput" type="search" placeholder="Rechercher des utilisateurs..." aria-label="Rechercher"></div>
<div class="section-title">Aperçus</div>
<div id="storyRow" class="story-row"><button id="createStoryButton" class="story-item" type="button"><span class="story-circle add">+</span><span class="story-name">Créer</span></button></div>
<div class="section-title" id="listTitle">Discussions</div>
<div id="userList"><div class="empty">Chargement...</div></div>
</main>
<nav class="bottom-nav" aria-label="Navigation principale">
<button class="nav-button active" data-tab="chats"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8 8 0 0 1-4-.9L3 20l1.4-4A7.5 7.5 0 1 1 20 11.5Z"/></svg><span>Discussions</span></button>
<button class="nav-button" data-tab="stories"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg><span>Actus</span></button>
<button class="nav-button" data-tab="communities"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5"/></svg><span>Communautés</span></button>
<button class="nav-button" data-tab="calls"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2Z"/></svg><span>Appels</span></button>
</nav>
</section>

<section id="chatPage" class="page chat-page hidden">
<header class="chat-header">
<button class="icon-button" id="backFromChat" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
<div id="chatAvatar" class="avatar small">A</div>
<div class="user-main"><div class="user-name"><span id="chatUsername">Discussion</span><span id="chatVerified"></span></div><div class="last-message" id="chatStatus">APPCHAT</div></div>
<button class="icon-button" id="chatInfoButton" aria-label="Informations"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/></svg></button>
</header>
<div id="chatMessages" class="chat-messages"><div class="empty">Chargement des messages...</div></div>
<form id="messageForm" class="composer">
<button class="icon-button" id="chatMediaButton" type="button" aria-label="Envoyer une photo ou une vidéo" title="Photo ou vidéo">
<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg>
</button>
<input id="messageInput" maxlength="4000" placeholder="Écrire un message..." autocomplete="off">
<button class="send-button" type="submit" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
</form>
</section>

<section id="subPage" class="page hidden">
<header class="topbar"><button class="icon-button" id="subBack" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="top-brand"><span id="subTitle">APPCHAT</span></div><span style="width:42px"></span></header>
<main id="subContent" class="content"></main>
</section>
</div>

<input id="galleryInput" type="file" accept="image/*,video/*" class="hidden">
<input id="profileGalleryInput" type="file" accept="image/*" class="hidden">
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="storyViewer" class="story-viewer hidden">
<button id="closeStoryViewer" class="icon-button story-close" aria-label="Fermer">✕</button>
<img id="storyViewerImage" alt="Aperçu" class="hidden">
<video id="storyViewerVideo" class="hidden" controls playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* Configuration Supabase existante : ne pas remplacer ces valeurs. */
const SUPABASE_URL="https://jebypdzahbhwjnyyepyc.supabase.co";
const SUPABASE_PUBLIC_KEY="sb_publishable_zopRaeiintTmlazVVp3Aow_0m7bC2Wk";
const AUTH_FUNCTION_URL = SUPABASE_URL + "/functions/v1/blockchat-auth";
const REST_URL=SUPABASE_URL+"/rest/v1/";
const STORAGE_BUCKET="appchat-media";

const $=id=>document.getElementById(id);
const supabaseReady=!!(window.supabase&&window.supabase.createClient);
const supabaseClient=supabaseReady?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY):null;

let isRegisterMode=false,currentUser=null,currentSession=null,currentTab="chats",activeChatUser=null;
let usersCache=[],messagesTimer=null,usersTimer=null,toastTimer=null,localStories=[];
const USER_STORAGE_KEY="appchat_user",SESSION_STORAGE_KEY="appchat_session";
const OFFICIAL_SUBSCRIPTION_KEY="appchat_official_subscription";

function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showToast(m){$("toast").textContent=m;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),4000);}
function setMessage(id,text,type="error"){const e=$(id);if(!e)return;e.className=text?type:"";e.textContent=text||"";}
function safeImageURL(v){if(!v)return"";try{const u=new URL(v);return["https:","http:"].includes(u.protocol)?u.href:"";}catch(_){return"";}}
function avatarHTML(u,small=false){const n=u?.username||"?";const p=safeImageURL(u?.photo_url);return `<div class="${small?"avatar small":"avatar"}">${p?`<img src="${escapeHTML(p)}" alt="" referrerpolicy="no-referrer">`:escapeHTML(n.charAt(0).toUpperCase())}</div>`;}
function verifiedHTML(u){return u?.has_badge?'<span class="verified" title="Compte vérifié"><svg viewBox="0 0 12 12"><path d="m2 6 2.5 2.5L10 3"/></svg></span>':"";}
function officialBadge(){return '<span class="verified" title="Compte officiel APPCHAT"><svg viewBox="0 0 12 12"><path d="m2 6 2.5 2.5L10 3"/></svg></span>';}
function showOnly(id){["authPage","homePage","chatPage","subPage"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}
function persistSession(){try{if(currentUser)localStorage.setItem(USER_STORAGE_KEY,JSON.stringify(currentUser));if(currentSession)localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify(currentSession));}catch(_){showToast("Le stockage local est indisponible.");}}
function clearSessionStorage(){localStorage.removeItem(USER_STORAGE_KEY);localStorage.removeItem(SESSION_STORAGE_KEY);}
function restoreSession(){try{const u=JSON.parse(localStorage.getItem(USER_STORAGE_KEY)||"null"),s=JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY)||"null");if(u?.id&&s?.access_token){currentUser=u;currentSession=s;return true;}}catch(_){}return false;}

async function authRequest(action,username,password,extras={}) {
 const r=await fetch(AUTH_FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLIC_KEY},body:JSON.stringify({action,username,password,...extras})});
 const raw=await r.text();let data;try{data=raw?JSON.parse(raw):{};}catch(_){throw new Error("Réponse invalide du serveur d’authentification.");}
 if(!r.ok||data.error||data.success===false)throw new Error(data.error||data.message||"La demande a échoué.");
 return data;
}
function extractUser(r){return r?.user||r?.profile||r?.account||r?.data?.user||null;}
function extractSession(r){return r?.session||r?.data?.session||null;}
function normalizeUser(u){if(!u)return null;const m=u.user_metadata||{};return{id:u.id,username:u.username||m.username||u.email?.split("@")[0]||"Utilisateur",bio:u.bio??m.bio??"",photo_url:u.photo_url??m.photo_url??null,has_badge:!!u.has_badge,is_online:u.is_online??true,categorie:u.categorie??null,description_badge:u.description_badge??null,created_at:u.created_at??null};}

async function showHome(user,session) {
 currentUser=normalizeUser(user);currentSession=session||currentSession;
 if(!currentUser?.id||!currentSession?.access_token){currentUser=null;currentSession=null;showOnly("authPage");setMessage("authMessage","Le serveur n’a pas renvoyé une session valide. Vérifie la fonction d’authentification.");return;}
 persistSession();showOnly("homePage");setMessage("authMessage","");await loadUsers();renderStories();renderUsers();startRefresh();
}
function startRefresh(){stopRefresh();usersTimer=setInterval(()=>{if(currentUser&&currentTab==="chats"&&!activeChatUser)loadUsers(true);},15000);}
function stopRefresh(){if(usersTimer)clearInterval(usersTimer);if(messagesTimer)clearInterval(messagesTimer);usersTimer=null;messagesTimer=null;}
function restHeaders(extra={}){return{"apikey":SUPABASE_PUBLIC_KEY,"Authorization":"Bearer "+(currentSession?.access_token||""),"Content-Type":"application/json",...extra};}
async function restRequest(path,options={}) {
 if(!currentSession?.access_token)throw new Error("Ta session n’est pas disponible. Reconnecte-toi.");
 const r=await fetch(REST_URL+path,{...options,headers:restHeaders(options.headers||{})});
 const raw=await r.text();let d=null;try{d=raw?JSON.parse(raw):null;}catch(_){d=raw;}
 if(r.status===401)throw new Error("SESSION_INVALID");
 if(!r.ok){const m=typeof d==="object"&&d?(d.message||d.details||d.hint||d.error||"Erreur Supabase."):"Erreur Supabase.";throw new Error(m);}
 return d;
}
function handleRequestError(e){const m=e?.message||"Une erreur est survenue.";if(m==="SESSION_INVALID"){showToast("La session a expiré. Reconnecte-toi pour continuer.");stopRefresh();showOnly("authPage");return;}showToast(m);}

/* Galerie et stockage des médias dans Supabase Storage. */
function fileExtension(file){const ext=(file.name.split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");return ext.slice(0,8)|| (file.type.startsWith("video/")?"mp4":"jpg");}
async function uploadMedia(file,kind="media"){
 if(!currentUser||!currentSession?.access_token)throw new Error("Connecte-toi avant d’envoyer un média.");
 if(!file)throw new Error("Aucun fichier sélectionné.");
 if(!/^image\/|^video\//.test(file.type))throw new Error("Choisis une image ou une vidéo.");
 if(file.size>50*1024*1024)throw new Error("Le fichier dépasse la limite de 50 Mo.");
 const path=`${currentUser.id}/${kind}-${Date.now()}-${crypto.randomUUID()}.${fileExtension(file)}`;
 const url=SUPABASE_URL+"/storage/v1/object/"+STORAGE_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/");
 const r=await fetch(url,{method:"POST",headers:{"apikey":SUPABASE_PUBLIC_KEY,"Authorization":"Bearer "+currentSession.access_token,"Content-Type":file.type,"x-upsert":"false"},body:file});
 const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{};}catch(_){}
 if(!r.ok)throw new Error(data.message||data.error||"Envoi impossible. Vérifie le bucket Supabase appchat-media et ses règles.");
 return{url:SUPABASE_URL+"/storage/v1/object/public/"+STORAGE_BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/"),type:file.type};
}
function mediaHTML(content){
 const m=String(content||"").match(/^\[\[MEDIA:(IMAGE|VIDEO)\]\](https:\/\/\S+)$/);
 if(!m)return escapeHTML(content).replace(/\n/g,"<br>");
 const url=safeImageURL(m[2]);if(!url)return "Média indisponible.";
 if(m[1]==="VIDEO")return `<video class="message-media" src="${escapeHTML(url)}" controls playsinline preload="metadata"></video>`;
 return `<a href="${escapeHTML(url)}" target="_blank" rel="noopener"><img class="message-media" src="${escapeHTML(url)}" alt="Photo envoyée" loading="lazy"></a>`;
}

 if(!supabaseReady){setMessage("authMessage","Impossible de charger Supabase. Vérifie la connexion Internet.");return;}
 if(!restoreSession()){showOnly("authPage");return;}
 showOnly("homePage");
 try{
  const rows=await restRequest("users?select=id,username,bio,photo_url,has_badge,is_online,categorie,description_badge,created_at&id=eq."+encodeURIComponent(currentUser.id));
  if(Array.isArray(rows)&&rows[0])currentUser=normalizeUser({...rows[0],id:currentUser.id});
  persistSession();await showHome(currentUser,currentSession);
 }catch(e){
  if(e.message==="SESSION_INVALID"){showOnly("authPage");setMessage("authMessage","Ta session a expiré. Connecte-toi avec ton compte existant.");}
  else{showOnly("homePage");renderStories();renderUsers();showToast("Connexion au serveur impossible pour le moment. Réessaie quand Internet fonctionne.");}
 }
}
init();
</script>
